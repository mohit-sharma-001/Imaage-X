<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageX — Premium Offline AI Studio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="bg-blur"></div>
    <div class="bg-gradient"></div>

    <div class="app-container">
        <!-- HEADER -->
        <header class="glass-header">
            <div class="brand">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
                        <circle cx="9" cy="9" r="2" />
                        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>ImageX</h1>
                    <span class="version-tag">v1.0</span>
                </div>
            </div>

            <div class="status-group">
                <div class="status-pill" id="statusOffline">
                    <span class="status-dot dot-offline"></span> OFFLINE
                </div>
                <div class="status-pill" id="statusDb">
                    <span class="status-dot dot-db"></span> DB
                </div>
            </div>
        </header>

        <main class="main-content">
            <!-- LEFT PANEL: CONTROLS -->
            <aside class="side-panel glass-card">
                <div class="panel-header">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <h2>Generation Settings</h2>
                </div>

                <div class="settings-grid">
                    <div class="chip" id="chipSteps" data-value="25" data-tooltip="Number of iterations. Higher = more detail but slower.">
                        <span class="label">Steps</span>
                        <span class="value">25</span>
                    </div>
                    <div class="chip" id="chipCfg" data-value="7.5" data-tooltip="Guidance Scale. Higher = follows prompt more strictly.">
                        <span class="label">CFG</span>
                        <span class="value">7.5</span>
                    </div>
                    <div class="chip" id="chipSize" data-value="512x512" data-tooltip="Output image dimensions in pixels.">
                        <span class="label">Size</span>
                        <span class="value">512px</span>
                    </div>
                    <div class="chip" id="chipSeed" data-value="random" data-tooltip="Random starting point. Same seed + same prompt = same image.">
                        <span class="label">Seed</span>
                        <span class="value">Auto</span>
                    </div>
                    <div class="chip" id="chipStyle" data-value="None" data-tooltip="Artistic filters to apply to your prompt.">
                        <span class="label">Style</span>
                        <span class="value">None</span>
                    </div>
                </div>

                <div class="inline-control-panel" id="controlPanel">
                    <!-- Controls injected here -->
                </div>

                <div class="tip-card">
                    <p><strong>Pro Tip:</strong> Use higher steps (35+) for more details, or Cinematic style for
                        dramatic lighting.</p>
                </div>
            </aside>

            <!-- RIGHT PANEL: PROMPT & OUTPUT -->
            <section class="generation-area">
                <div class="prompt-container glass-card">
                    <textarea id="promptInput"
                        placeholder="A futuristic city with neon lights, cinematic lighting, 8k..."
                        spellcheck="false"></textarea>

                    <div class="generation-footer">
                        <div class="progress-info">
                            <div class="progress-track">
                                <div id="progressBar" class="progress-bar"></div>
                            </div>
                            <p id="statusLine" class="status-line">System ready</p>
                        </div>
                        <button id="generateBtn" class="btn-primary">
                            <span>Generate</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- OUTPUT PANEL -->
                <div id="outputPanel" class="output-container glass-card">
                    <div class="result-viewer">
                        <img id="generatedImage" src="" alt="Generated artwork">
                        <div class="image-overlay">
                            <div class="action-bar">
                                <button id="downloadBtn" class="action-btn" title="Download">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                        <polyline points="7 10 12 15 17 10" />
                                        <line x1="12" x2="12" y1="15" y2="3" />
                                    </svg>
                                </button>
                                <button id="regenerateBtn" class="action-btn" title="Regenerate">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
                                        <path d="M21 3v5h-5" />
                                    </svg>
                                </button>
                                <button id="clearBtn" class="action-btn btn-close" title="Clear">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M18 6 6 18" />
                                        <path d="m6 6 12 12" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="metadata-grid" id="imageMetadata">
                        <!-- Metadata items injected here -->
                    </div>
                </div>
            </section>
        </main>

        <!-- HISTORY SECTION -->
        <footer class="history-section glass-card">
            <div class="history-header">
                <div class="title-with-count">
                    <h2>Recent Creations</h2>
                    <span id="historyCount" class="badge">0</span>
                </div>
                <div class="history-actions">
                    <button id="clearHistoryBtn" class="btn-text">Clear All</button>
                    <button id="toggleHistory" class="btn-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m18 15-6-6-6 6" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="historyList" class="history-gallery">
                <!-- History cards injected here -->
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
